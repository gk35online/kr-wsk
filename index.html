<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WSK Final Cup Display v2 (live timing)</title>
<meta name="theme-color" content="#161617">
<style>
@font-face{font-family:Inter;font-weight:300;src:url(fonts/inter-300.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-800.woff2) format("woff2");font-display:swap}

/* VOICE: a timing-screen in the awning, readable from across the pit
   IDEA: the circuit's timing monitor - one column per class, huge numbers
   PICTURE: four tall countdown columns filling the screen, logos in the header bar
   COLOUR and TYPE: black ground in both themes, white, signal red, class colours; Inter Display ExtraBold numbers, Inter text
   LAYOUT: header bar (logos, title, clock) / four columns / "up next" strip, sized in vh+vw for any TV */
:root{color-scheme:dark;--bg:#0b0c0e;--panel:#16171a;--ink:#f4f4f2;--mute:#8e9198;--line:#26282d;--red:#e10600;
--okn:#e10600;--oknj:#ff8a00;--ok:#1e6fff;--okj:#12b886;--u:min(.82vw,1.46vh)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(var(--u)*1.6)/1.35 Inter,system-ui,sans-serif;font-optical-sizing:auto;overflow:hidden;
 display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:calc(var(--u)*1);padding:calc(var(--u)*1.3) calc(var(--u)*1.6)}
body.hide{cursor:none}
header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*2.4);
 padding-bottom:calc(var(--u)*1.2);border-bottom:calc(var(--u)*.45) solid var(--red)}
.logos{display:flex;align-items:center;gap:calc(var(--u)*2)}
.logo{height:calc(var(--u)*5.2);display:flex;align-items:center}
.logo img{height:100%;width:auto;max-width:calc(var(--u)*32);object-fit:contain}
.wm{font-weight:800;font-size:calc(var(--u)*2.4);line-height:1;letter-spacing:-.01em;border:2px solid var(--line);border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.9) calc(var(--u)*1.3);white-space:nowrap}
.wm span{color:var(--red)}
.sep{width:2px;align-self:stretch;background:var(--line)}
h1{margin:0;font-weight:800;white-space:nowrap;font-size:calc(var(--u)*3.4);line-height:1.05;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*.3)}
.clock{text-align:right}
.clock b{display:block;font-weight:800;font-size:calc(var(--u)*4.4);line-height:1;font-variant-numeric:tabular-nums}
.clock span{color:var(--mute);font-size:calc(var(--u)*1.4)}
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:calc(var(--u)*1.2);min-height:0}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,auto auto minmax(auto,1fr) auto auto);column-gap:calc(var(--u)*1.1);row-gap:0;min-height:0}
main>.col{margin-bottom:calc(var(--u)*1.1)}main>.col:nth-child(n+3){margin-bottom:0}
.col{background:var(--panel);border-radius:calc(var(--u)*1);border-top:calc(var(--u)*.7) solid var(--c);padding:calc(var(--u)*1) calc(var(--u)*1.3);display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:calc(var(--u)*.35);align-content:start;overflow:hidden}
.cls{font-weight:800;font-size:calc(var(--u)*3.7);line-height:.95;letter-spacing:-.03em;color:var(--c)}
.what{font-weight:700;font-size:calc(var(--u)*2.1);line-height:1.15;margin-top:calc(var(--u)*.2)}
.grp{color:var(--mute);font-size:calc(var(--u)*1.5)}
.grp.g{display:inline-block;justify-self:start;color:#fff;background:var(--c);font-weight:800;font-size:calc(var(--u)*2.1);line-height:1.2;border-radius:calc(var(--u)*.5);padding:calc(var(--u)*.25) calc(var(--u)*.8)}
.grp.g.all{visibility:hidden}
.drv{align-content:flex-start;align-items:flex-start}
.when{font-size:calc(var(--u)*1.7);font-weight:600;font-variant-numeric:tabular-nums}
.cd{font-weight:800;font-size:calc(var(--u)*4.9);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:auto}
.cd small{font-size:.42em;color:var(--mute);margin-right:.15em}
.state{font-weight:700;font-size:calc(var(--u)*1.45);display:flex;align-items:center;gap:.5em;color:var(--mute)}
.dot{width:.65em;height:.65em;border-radius:50%;background:currentColor}
.live{background:#2a0d0c}.live .cd,.live .state{color:#ff3b30}
.live .dot{animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.live .dot{animation:none}}
.soon .cd{color:#ffcc00}
.drv{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.45) calc(var(--u)*.5);margin-top:calc(var(--u)*.6)}
.drv span{background:#24262b;border-radius:calc(var(--u)*.45);padding:calc(var(--u)*.15) calc(var(--u)*.55);font-size:calc(var(--u)*1.35);font-weight:600;white-space:nowrap}
.drv b{color:var(--c);margin-right:.3em}
.drv em{font-style:normal;color:var(--mute);font-size:calc(var(--u)*1.35);font-weight:500;width:100%}
.live .drv span{background:#3a1715}
.hd{display:flex;align-items:baseline;gap:calc(var(--u)*1);min-width:0}
.hd .cls{font-size:calc(var(--u)*2.9)}
.hd .what{font-size:calc(var(--u)*1.75);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*.4) calc(var(--u)*.9);font-size:calc(var(--u)*1.45)}
.meta .grp{font-size:calc(var(--u)*1.35)}.meta .grp.g{font-size:calc(var(--u)*1.45);padding:calc(var(--u)*.1) calc(var(--u)*.55)}
.meta .when{font-size:calc(var(--u)*1.45)}
main .drv{margin-top:0}main .drv span{font-size:calc(var(--u)*1.2)}main .drv em{font-size:calc(var(--u)*1.1)}
.cdrow{display:flex;align-items:baseline;gap:calc(var(--u)*1);flex-wrap:wrap}
main .cd{font-size:calc(var(--u)*3.6);margin:0}
main .state{font-size:calc(var(--u)*1.25)}
main .then{font-size:calc(var(--u)*1.2);padding-top:calc(var(--u)*.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr{background:var(--panel);border-radius:calc(var(--u)*1);border-top:calc(var(--u)*.7) solid var(--red);padding:calc(var(--u)*1.1) calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.8);min-height:0;overflow:hidden}
.krh{display:flex;align-items:center;gap:calc(var(--u)*.8);flex-wrap:wrap}
.krh b{font-weight:800;font-size:calc(var(--u)*2.3);letter-spacing:-.01em}
.krh .rt{margin-left:auto;font-weight:800;font-size:calc(var(--u)*1.8);font-variant-numeric:tabular-nums}
.krs{font-size:calc(var(--u)*1.5);color:var(--mute);display:flex;gap:calc(var(--u)*.6);align-items:center;flex-wrap:wrap}
.krs .tag{margin:0}
.flag{width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:3px;background:#444;flex:none}
.flag.lg{background:#12b886}.flag.ly{background:#ffcc00}.flag.lr{background:#e10600}
.flag.lf{background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/50% 50%}
.krt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.krt th{font-size:calc(var(--u)*1.15);color:var(--mute);font-weight:600;text-align:right;padding:0 calc(var(--u)*.5) calc(var(--u)*.4);white-space:nowrap}
.krt th:nth-child(-n+3){text-align:left}
.krt td{font-size:calc(var(--u)*1.7);padding:calc(var(--u)*.55) calc(var(--u)*.5);border-top:2px solid var(--line);text-align:right;white-space:nowrap}
.krt td.p{text-align:left;font-weight:800;font-size:calc(var(--u)*2.6);width:1%;line-height:1}
.krt td.p small{font-size:.45em;color:var(--mute);font-weight:600}
.krt td.n{text-align:left;width:1%}.krt td.n span{display:inline-block;color:#fff;background:var(--c);font-weight:800;border-radius:.3em;padding:.05em .4em}
.krt td.d{text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:0;width:50%}
.krt td.g{font-weight:800;color:#ffcc00}.krt td.g.lead{color:#12b886}
.krt td.b{color:var(--ink)}.krt td.l{color:var(--mute)}
.krt tr.up td.p{color:#12b886}.krt tr.dn td.p{color:#ff3b30}
.krempty{color:var(--mute);font-size:calc(var(--u)*1.6);line-height:1.4}
.krempty b{color:var(--ink)}
.krf{margin-top:auto;color:var(--mute);font-size:calc(var(--u)*1.2)}
.then{border-top:2px solid var(--line);padding-top:calc(var(--u)*.7);font-size:calc(var(--u)*1.5);color:var(--mute)}
.then b{color:var(--ink)}
footer{display:flex;align-items:center;gap:calc(var(--u)*1.6);border-top:2px solid var(--line);padding-top:calc(var(--u)*1.1);overflow:hidden;white-space:nowrap}
footer .lbl{font-weight:800;color:var(--red);font-size:calc(var(--u)*1.7);flex:none}
.nx{display:flex;gap:calc(var(--u)*2.4);overflow:hidden;font-size:calc(var(--u)*1.7)}
.nx div{flex:none}.nx b{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-weight:800;color:#fff;background:var(--c);border-radius:.3em;padding:.05em .45em;margin:0 .35em}
.wx{display:grid;font-size:.95em;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:calc(var(--u)*1);align-items:stretch}
.wx .h{display:flex;flex-direction:column;justify-content:center;padding-right:calc(var(--u)*.8)}
.wx .h b{font-weight:800;font-size:calc(var(--u)*1.8);line-height:1.1}
.wx .h span{color:var(--mute);font-size:calc(var(--u)*1.2)}.wx .h .nw{color:var(--ink);font-weight:600;font-size:calc(var(--u)*1.5)}
.day{background:var(--panel);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.45) calc(var(--u)*1.1);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*1)}
.day.today{outline:2px solid var(--ink)}
.day.gone{opacity:.35}
.day svg{width:calc(var(--u)*3);height:calc(var(--u)*3)}
.day .n{font-weight:700;font-size:calc(var(--u)*1.6);line-height:1.15;white-space:nowrap}
.day .c{color:var(--mute);font-size:calc(var(--u)*1.3);line-height:1.25;white-space:nowrap}
.day .t{text-align:right;font-weight:800;font-size:calc(var(--u)*2.2);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.day .t small{display:block;font-weight:600;font-size:.6em;color:var(--mute)}
.day .r{color:#5ab0ff}
@media(max-aspect-ratio:1/1){.wx{grid-template-columns:repeat(2,minmax(0,1fr))}.wx .h{grid-column:1/-1}}
.lt{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*.6) calc(var(--u)*2);font-size:calc(var(--u)*1.6);background:var(--panel);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.4);margin-top:calc(var(--u)*-.4)}
.lt .dot{width:.7em;height:.7em;border-radius:50%;background:var(--mute)}
.lt.ok .dot{background:#12b886}
.lt b{font-weight:800}
.lt .dl{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:#12b886}
.lt.late .dl{color:#ffcc00}
.when s{color:var(--mute);font-weight:500;margin-right:.2em}
.when .est{font-size:.75em;color:#ffcc00;font-weight:700}
#toast{opacity:0;position:fixed;left:50%;top:calc(var(--u)*2);transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);font:700 18px Inter,sans-serif;padding:12px 20px;border-radius:999px;transition:transform .3s,opacity .3s}
#toast.show{transform:translate(-50%,0);opacity:1}
.todo{display:flex;align-items:stretch;gap:calc(var(--u)*1.6);overflow:hidden}
.todo:empty{display:none}
.todo .lbl{flex:none;display:flex;align-items:center;font-weight:800;font-size:calc(var(--u)*1.7);color:#ffcc00;padding-right:calc(var(--u)*.4)}
.td{flex:1 1 0;min-width:0;background:var(--panel);border-radius:calc(var(--u)*.7);border-left:calc(var(--u)*.45) solid var(--mute);padding:calc(var(--u)*.55) calc(var(--u)*1);display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:calc(var(--u)*1.1);align-items:center}
.td.now{border-left-color:#ffcc00;background:#2a2610}
.td.soon{border-left-color:#ff8a00}
.td .w{font-weight:700;font-size:calc(var(--u)*1.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .w{grid-column:2}.td .m{grid-column:2;font-size:calc(var(--u)*1.2);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .m .tag{font-size:.9em;padding:0 .35em;margin:0 .25em 0 0}
.td .c{grid-row:1/3;grid-column:1;text-align:left;padding-right:calc(var(--u)*1.1);border-right:2px solid var(--line);font-weight:800;font-size:calc(var(--u)*1.9);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.td .c small{display:block;font-size:.6em;font-weight:600;color:var(--mute)}
.td.now .c{color:#ffcc00}
#fs{position:fixed;right:calc(var(--u)*1.6);bottom:calc(var(--u)*5.5);font:600 16px Inter,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;transition:opacity .4s}
#fs:focus-visible{outline:3px solid var(--red);outline-offset:2px}
body.hide #fs{opacity:0;pointer-events:none}
@media(max-aspect-ratio:1/1){body{overflow:auto;height:auto}.stage{grid-template-columns:minmax(0,1fr)}main{grid-template-rows:none;grid-auto-rows:auto}:root{--u:1.6vw}header{grid-template-columns:minmax(0,1fr) auto}.logos{grid-column:1/-1}}

/* ===================== KR Motorsport look (visual only) ===================== */
:root{--bg:#161617;--panel:#1e1e1f;--raised:#2b2b2c;--line:#333335;--ink:#ffffff;--mute:#9b9b9e;
 --kr-red:#b92630;--kr-orange:#f36527;--kr-blue:#59aee4;--kr-yellow:#fdc619;
 --kr-stripe:linear-gradient(90deg,#b92630 0 33.4%,#f36527 0 66.7%,#59aee4 0)}
html{background:#161617}
body{background:transparent;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;
 padding-top:34px;position:relative}
button,input,select,pre{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* brand tab, top-left corner */
body::before{content:"";position:absolute;top:0;left:0;width:26px;height:28px;background:var(--kr-stripe);z-index:1;pointer-events:none}
/* bars background, always on */
#bgLayer{position:fixed;inset:0;z-index:-1;pointer-events:none;background:#161617;overflow:hidden}
#bgLayer::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:340px;max-width:70vw;height:100%;
 background:url("kr-bars.svg") center bottom/cover no-repeat;opacity:.2}
#bgLayer::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,#161617 88%)}
/* heading + the stripe under it */
header{border-bottom:1px solid var(--line)}
h1{font-weight:800;text-transform:uppercase;letter-spacing:-0.02em;position:relative;padding-bottom:calc(var(--u)*.9)}
h1{font-size:calc(var(--u)*2.9)}
@media(max-aspect-ratio:1/1){h1{white-space:normal;font-size:calc(var(--u)*3.2)}}
h1::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:4px;background:var(--kr-stripe)}
.krh b{font-weight:800;text-transform:uppercase;letter-spacing:-0.02em}
/* small section labels */
footer .lbl,.todo .lbl,.krt th{font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
footer .lbl,.todo .lbl{font-size:calc(var(--u)*1.3)}
.todo .lbl{color:var(--kr-orange)}
.krt th{font-size:calc(var(--u)*1.05);padding:calc(var(--u)*.55) calc(var(--u)*.5)}
.krt thead tr{background:var(--raised)}
/* panels, cards, chips: square corners, solid 1px lines */
.col,.kr,.lt,.td,.day,.wm{border-radius:2px}
.tag,.grp.g,.drv span,.krt td.n span,.flag{border-radius:2px}
.kr{border-top:1px solid var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.lt{border:1px solid var(--line)}
.drv span{background:var(--raised)}
.krt td{border-top:1px solid var(--line)}
.then,footer{border-top-width:1px}
.td .c{border-right-width:1px}
.krt td.d{color:var(--ink)}
/* buttons */
#fs{border-radius:2px;background:var(--ink);color:#161617;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:12.5px;
 text-transform:uppercase;letter-spacing:.1em}
#toast{border-radius:2px;font-family:Inter,system-ui,sans-serif;font-weight:700}
/* focus */
:focus-visible{outline:2px solid var(--kr-yellow);outline-offset:2px}
#fs:focus-visible{outline:2px solid var(--kr-yellow);outline-offset:2px}
</style>
</head>
<body>
<div id="bgLayer"></div>

}
function setManual(m){LT.manual=m;LT.manualAt=Date.now();saveLT();
 toast.textContent=m==null?'Delay: automatic from live timing':`Delay set by hand: ${m>0?'+':''}${m} min`;toast.classList.add('show');
 clearTimeout(setManual.t);setManual.t=setTimeout(()=>toast.classList.remove('show'),2500)}
addEventListener('keydown',e=>{const td=todayD(Date.now()),cur=LT.manual!=null?LT.manual:(LT.delay[td]||0);
 if(e.key==='+'||e.key==='=')setManual(cur+1);else if(e.key==='-')setManual(cur-1);else if(e.key==='0')setManual(null)});

const todoEl=document.getElementById('todo');
const SHORT={'Administrative check & pass':'Admin check & pass','Scrutineering & tyre delivery':'Scrutineering & tyres'};
function renderTodo(now){
 const items=E.filter(e=>e.sec==='Admin'&&e.f>now).sort((a,b)=>a.s-b.s).slice(0,3);
 if(!items.length){todoEl.innerHTML='';return}
 todoEl.innerHTML='<span class="lbl">To do</span>'+items.map(e=>{const on=e.s<=now,soon=!on&&e.s-now<1800000;
  const day=e.d===todayD(now)?'':DAY3[e.d]+' ';
  return `<div class="td${on?' now':soon?' soon':''}"><div class="c">${on?`<small>open until</small>${hm(e.f)}`:`${day}${hm(e.s)}`}</div><div class="w">${esc(SHORT[e.label]||e.label)}</div>
   <div class="m">${e.cls.filter(c=>CL.includes(c)).map(c=>`<span class="tag" style="--c:${COL[c]}">${c}</span>`).join('')}${esc(e.extra.replace(/, until.*$/,''))}</div>
   </div>`}).join('');
}
function tick(){
 const now=Date.now();
 adjust(now);renderLT(now);renderKR(now);renderTodo(now);
 document.getElementById('now').textContent=fmt.format(now);
 document.getElementById('nowd').textContent=fmtd.format(now);
 const tm=e=>e.dl&&!LT.state[e.id]?`<s>${e.t}</s> ${hm(e.s)}`:hm(e.s);
 cols.innerHTML=CL.map(c=>{
  const tr=E.filter(e=>e.cls.includes(c)&&e.sec!=='Admin'&&e.f>now).sort((a,b)=>a.s-b.s),cur=tr[0],n2=tr[1];
  if(!cur)return `<section class="col" style="--c:${COL[c]}"><div class="hd"><span class="cls">${c}</span><span class="what">Weekend complete</span></div><div></div><div></div><div></div><div></div></section>`;
  const live=cur.s<=now,soon=!live&&cur.s-now<300000,timed=cur.liveNow;
  const day=cur.d===todayD(now)?'Today':DAY3[cur.d];
  const note=cur.extra==='race'?`pre-grid closes ${hm(cur.s-300000)}`:cur.extra.startsWith('grid')?`grid forms ${hm(cur.s-300000)}`:cur.note;
  const rem=timed&&LT.remain!=null&&LT.sess&&LT.sess.ev===cur.id?Math.max(0,LT.remain-(now-LT.remainAt)):null;
  return `<section class="col${live?' live':soon?' soon':''}" style="--c:${COL[c]}">
   <div class="hd"><span class="cls">${c}</span><span class="what">${esc(cur.label)}</span></div>
   <div class="meta">${isG(cur)&&cur.extra!=='All'?`<span class="grp g">${esc(cur.extra)}</span>`:note&&!isG(cur)?`<span class="grp">${esc(note)}</span>`:''}<span class="when">${day} · ${tm(cur)}${cur.dl&&!live?` <span class="est">est.</span>`:''}</span></div>
   ${(k=>`<div class="drv">${k.list.length?k.list.map(d=>`<span><b>${d[0]}</b>${esc(d[2])}</span>`).join(''):'<em>No KR drivers in this group</em>'}</div>`)(krFor(cur,c))}
   <div class="cdrow"><div class="cd">${live?dur(rem!=null?rem:cur.f-now):dur(cur.s-now)}</div><div class="state"><span class="dot"></span>${live?(timed?'On track · live':(cur.extra==='race'||cur.extra.startsWith('grid')?'Racing · est.':'On track')):soon?'Starting soon':cur.dl?'Until start · adj.':'Until start'}</div></div>
   <div class="then">${n2?`Then <b>${esc(n2.label)}${isG(n2)&&n2.extra!=='All'?' · '+esc(n2.extra):''}</b> · ${n2.d===todayD(now)?'':DAY3[n2.d]+' '}${hm(n2.s)}`:'Last session'}</section>`}).join('');
 nx.innerHTML=E.filter(e=>e.sec!=='Admin'&&e.s>now).sort((a,b)=>a.s-b.s).slice(0,8).map(e=>
  `<div><b>${e.d===todayD(now)?'':DAY3[e.d]+' '}${hm(e.s)}</b><span class="tag" style="--c:${COL[e.cls[0]]}">${e.cls[0]}</span>${esc(e.label)}${isG(e)&&e.extra!=='All'?' · '+esc(e.extra):''}</div>`).join('');
}
connectLT();
tick();setInterval(tick,1000);

const fs=document.getElementById('fs');
fs.addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen()}catch(e){}});
let idle;const wake=()=>{document.body.classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('hide'),4000)};
addEventListener('mousemove',wake);addEventListener('keydown',wake);wake();
}
</script>
</body>
</html>
